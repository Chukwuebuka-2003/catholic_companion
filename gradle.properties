org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Base URL of the rosary_server FastAPI deployment backing the in-app AI feature.
# AiRepository requires HTTPS and treats an empty value as "not connected",
# so a build without this property ships with the AI feature disabled.
AI_BASE_URL=https://rosary-server.vercel.app
